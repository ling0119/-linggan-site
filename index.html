<style>
/* Layout: one question per screen, nothing else on it */

*{box-sizing:border-box}

@media (min-width:768px){
 body .nav{background:linear-gradient(to top,#F2EDF8 72%,rgba(242,237,248,0));padding-top:30px}
}

.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.exg-wrap{margin-top:10px}.exg-sum{font-size:13px;font-weight:700;color:var(--accent);cursor:pointer;list-style:none;padding:5px 14px;border:1.5px dashed var(--dash);border-radius:999px;display:inline-block}.exg-sum::-webkit-details-marker{display:none}details[open] .exg-sum{border-style:solid;border-color:var(--accent)}.exg-box{margin-top:10px}

.hero h2{font-family:'ChironHero',var(--display);font-size:clamp(32px,9vw,48px);font-weight:900;margin:6px 0 0;letter-spacing:.06em;color:var(--ink);text-wrap:balance}
.hero .logo{display:flex;justify-content:center;margin-top:2px}
.hero .logo img{height:40px;width:auto;max-width:70%}
.hero .logo span{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.32em;color:var(--accent);text-transform:uppercase;padding:2px 0 2px .32em;border-top:1px solid var(--dash);border-bottom:1px solid var(--dash)}
.hero .kick{margin:8px 0 -6px;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.3em;padding-left:.3em}
.hero .aud{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.hero .sub2{margin:0;display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;letter-spacing:.08em;border-radius:999px;padding:5px 16px}
.hero .tag{font-size:16px;color:var(--ink);margin:0;max-width:22em;line-height:1.7}
.hero .star{width:22px;height:22px;margin-top:4px}
.steps3{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.steps3 li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:14px 16px}
.steps3 .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px}
.steps3 b{display:block;font-size:15px}
.steps3 span{font-size:13px;color:var(--muted)}
.start{margin-top:22px;width:100%;font:inherit;font-weight:700;font-size:17px;border:none;border-radius:999px;padding:9px 9px 9px 26px;background:linear-gradient(135deg,#8A6CC4,#B094E0);color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.start .arr{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);color:#FFFFFF;display:grid;place-items:center;font-size:19px;animation:float-arr 1.6s ease-in-out infinite}@keyframes float-arr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.start:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cont{font-size:13px;color:var(--muted);margin-top:10px}
.foot{margin-top:40px;text-align:center;color:var(--muted)}
.foot .fb{font-size:14px;margin-top:10px}
.foot .fn{color:var(--ink);font-weight:700;background:linear-gradient(transparent 50%,#D9CBE8 50%);padding:0 3px}
.foot .fb a.ig{color:var(--accent);text-decoration:underline;text-underline-offset:3px;letter-spacing:.1em;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700}
.foot .dot{margin:0 6px}
.foot a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.foot .fs{font-size:12px;line-height:1.7}
.cta{background:linear-gradient(135deg,rgba(190,155,228,.28),rgba(210,175,215,.32));border:1px solid rgba(155,120,195,.2);border-radius:20px;padding:18px 16px;margin-top:20px;display:flex;flex-direction:column;gap:8px}
.cta b{font-size:16px}
.cta p{margin:0;font-size:14px;color:var(--ink)}
.cta .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cta .id{font-weight:700;font-size:15px;user-select:all;font-family:"LXGW WenKai TC",serif;letter-spacing:.08em;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 12px}
.cta button,.cta a{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none}
.cta button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.cta a{background:#06C755;color:#fff;border:none}
.photo-note{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}

/* mini previews: fixed colors on purpose, they depict the post itself */
.pv{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:10px;overflow:hidden;color:#fff;font-family:var(--pvt)}
.pv>*{position:absolute}
.p1{background:radial-gradient(ellipse at 70% 20%,rgba(230,200,90,.55),transparent 35%),linear-gradient(165deg,#9aa39a 0%,#8a8e93 45%,#7c7a86 100%)}
.p1::before{content:"";position:absolute;inset:0;background:rgba(70,62,84,.28)}
.p1 .tn-unused{left:7%;right:7%;top:4.5%;display:flex;justify-content:space-between;font:500 5.5px var(--pvt);letter-spacing:.18em;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.85)}
.p1 .tn span{position:static}

.pv.p1.b1::before{background:rgba(70,62,84,.48)}
.pv.p1.b2::before{background:rgba(20,30,35,.15)}
.pv.p1.b3{background:linear-gradient(165deg,#7BAFD4 0%,#A8CCE0 50%,#B8D8E8 100%)}.p1.b3::before{background:rgba(0,0,0,.08)}.p1.b3 .et{color:#1a2a3a}.p1.b3 .es{color:#2a3a4a}.p1.b3 .ek{color:#1a2a3a;border:1.5px solid rgba(26,42,58,.4);background:rgba(255,255,255,.6)}
.p2::before{content:"";position:absolute;inset:0}
.pv.p2.b1::before{background:rgba(25,22,22,.55)}
.pv.p2.b2::before{background:rgba(15,20,25,.25)}
.pv.p2.b3::before{background:rgba(15,15,20,.3)}
.p1 .star{left:50%;top:17%;width:36px;height:36px;transform:translateX(-50%)}
.p1 .star svg{display:block}
.p1 .tt{left:0;right:0;top:36%;text-align:center;white-space:nowrap;font-weight:900;font-size:11px;line-height:1.5}
.p1 .sub{left:0;right:0;top:58%;text-align:center;white-space:nowrap;font:500 7.5px var(--pvt);letter-spacing:.06em}
.p1 .pill{left:18%;right:18%;top:72%;text-align:center;padding:3px 0;border-radius:999px;background:rgba(255,255,255,.72);color:#2A2530;font:500 7px var(--pvb);letter-spacing:.08em}
.p1 .acc{left:0;right:0;bottom:6%;text-align:center;font:500 6px var(--pvt);letter-spacing:.1em}
.p1 .nx{right:7%;bottom:6%;font:500 6px var(--pvt);letter-spacing:.12em}
.p1 .tf-unused{left:7%;right:7%;bottom:6%;display:flex;justify-content:space-between;align-items:flex-end;font:500 5.5px var(--pvt);letter-spacing:.12em}
.p1 .tf span{position:static}
.p2{background:#0a0a0a;color:#fff}.p2 .vcirc{left:5%;top:3.5%;width:11.5%;height:14.3%;border-radius:50%;border:1.5px solid #fff}.p2 .vtext{left:5%;top:3.5%;width:11.5%;text-align:center;line-height:14.3%;font:500 5px Arial,sans-serif;letter-spacing:.4em;color:#fff;padding-left:.4em}.p2 .vbar{left:18%;right:5.5%;top:7.9%;height:2px;background:#fff}.p2 .tt{left:7%;right:7%;top:16%;font:800 11px/1.3 var(--pvb);color:#fff;white-space:normal;text-align:center;letter-spacing:-.01em}.p2 .sub{left:7%;right:7%;top:56%;font:400 7px/1.7 var(--pvb);color:rgba(255,255,255,.72);white-space:normal;text-align:center}.p2 .it{left:7%;right:7%;top:18%;font:800 10px/1.3 var(--pvb);color:#fff;white-space:normal;text-align:center}.p2 .ib{left:7%;right:7%;top:52%;font:400 7px/1.7 var(--pvb);color:rgba(255,255,255,.72);white-space:normal;text-align:center}.p2 .et{left:7%;right:7%;top:16%;font:800 10.5px/1.3 var(--pvb);color:#fff;white-space:normal;text-align:center}.p2 .es{left:7%;right:7%;top:52%;font:400 7px/1.7 var(--pvb);color:rgba(255,255,255,.72);white-space:normal;text-align:center}.p2 .ek{left:7%;right:7%;top:70%;font:400 6.5px var(--pvb);color:rgba(255,255,255,.85);text-align:center}.p2 .acc{right:5.5%;bottom:4.5%;font:400 7.5px "Courier New",monospace;color:#fff;white-space:nowrap;letter-spacing:.03em}.p2 .vfline{left:5%;right:5%;bottom:10%;height:1.5px;background:#fff}
.p4{background:#0a0a0a}.p4::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.92) 100%);z-index:1}.p4 .tt{left:7%;right:7%;bottom:24%;font:900 13px/1.2 var(--pvb);color:#fff;white-space:normal;letter-spacing:-.01em;z-index:2}.p4 .dv{left:7%;right:7%;bottom:21%;z-index:2;display:flex;align-items:center;gap:5%}.p4 .dvl{flex:1;height:1.5px;background:rgba(255,255,255,.45)}.p4 .dvs{font-size:10px;color:rgba(255,255,255,.7)}.p4 .bd{left:7%;right:7%;bottom:6%;font:400 6.5px/1.7 var(--pvb);color:rgba(255,255,255,.82);white-space:normal;z-index:2}.p4 .ek{left:7%;right:7%;bottom:5%;font:400 6px var(--pvb);color:rgba(255,255,255,.7);z-index:2}.p4 .acc{right:5.5%;top:5%;font:400 6.5px var(--pvb);color:rgba(255,255,255,.75);letter-spacing:.04em;z-index:2}.p4 .ig{right:13%;top:4.8%;font-size:8px;color:rgba(255,255,255,.75);z-index:2}
.p4 .v{left:8%;bottom:10%;font:300 7px var(--pvb);letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg)}
.p4 .sg{right:8%;bottom:9%;text-align:right;font:300 7px/1.7 var(--pvb);opacity:.9}

pre{background:var(--code);color:var(--code-ink);border:1.5px solid #7A5AB0;border-radius:14px;padding:16px;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:14px;line-height:1.8;max-height:50vh;overflow:auto;margin:0}
.after{color:var(--muted);font-size:14px;margin-top:16px}
.guide-steps{margin:4px 0 24px;display:flex;flex-direction:column;gap:0}
.guide-step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid rgba(155,127,192,.1);align-items:flex-start}
.guide-step:last-child{border-bottom:none}
.gs-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:800;line-height:28px;text-align:center;flex-shrink:0;margin-top:1px}
.gs-body{flex:1;min-width:0}
.gs-text{font-size:14px;line-height:1.65;color:#3a2d50;margin:0 0 8px}
.gs-text:last-child{margin-bottom:0}
.gs-cmd{display:flex;align-items:center;gap:8px;background:rgba(155,127,192,.1);border-radius:10px;padding:9px 12px;margin-top:6px}
.gs-cmd span{flex:1;font-size:13px;color:#5a4070;font-family:monospace;letter-spacing:.01em}
.gs-cmd button{flex-shrink:0;background:#a47cc0;color:#fff;border:none;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}.gs-cmd button:active{opacity:.7}
.guide-tips-title{font-size:14px;font-weight:700;color:#7a5ca0;letter-spacing:.02em;margin:20px 0 10px}
.guide-tips{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.guide-tip{font-size:13px;color:#5a4070;line-height:1.6;padding:10px 14px;background:rgba(255,255,255,.6);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.guide-tip span{flex:1}
.guide-tip button{flex-shrink:0;background:transparent;color:#9b7fc0;border:1px solid rgba(155,127,192,.35);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}.guide-tip button:active{opacity:.6}
.tip-card{background:#1E1530;border-radius:14px;padding:14px 14px 14px 16px;margin:6px 0;display:flex;align-items:flex-start;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:1.5px solid #7A5AB0;color:#E8DEFF}
.tip-card .tc-body{flex:1;min-width:0}.tip-card .tc-text{font-size:14px;line-height:1.65;color:#3a2d50;margin:0}
.tip-card .tc-copy{flex-shrink:0;background:#7A5AB0;color:#fff;border:none;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;align-self:center;white-space:nowrap}.tip-card .tc-copy:active{opacity:.7}
.tip-dot{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;line-height:24px;text-align:center;flex-shrink:0;margin-top:2px}
@keyframes shimmer{0%,100%{box-shadow:0 6px 20px rgba(124,108,144,.32)}50%{box-shadow:0 6px 36px rgba(124,108,144,.7),0 0 0 4px rgba(124,108,144,.22)}}@keyframes chip-glow{0%,100%{outline:2px solid rgba(124,108,144,.4);outline-offset:1px}50%{outline:2px solid var(--accent);outline-offset:3px;box-shadow:0 0 10px rgba(124,108,144,.45)}}
.magic-btn{animation:shimmer 1.8s ease-in-out infinite}
.guide-footer{margin-top:24px;padding:14px 16px;background:rgba(255,255,255,.6);border-radius:14px;font-size:13px;color:var(--muted);line-height:1.7}
.copy-prompt-btn{display:block;width:100%;padding:13px;margin:12px 0 22px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.03em;transition:background .2s,color .2s}.copy-prompt-btn:active{opacity:.8}.copy-prompt-btn.done{background:#4A7C59;color:#fff}
.sel-pill{padding:8px 18px;border-radius:999px;border:1.5px solid var(--dash);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,color .15s,border-color .15s}.sel-pill.active,.sel-pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.out-steps-hd{font-size:14px;font-weight:700;color:#7a5ca0;letter-spacing:.02em;margin:16px 0 8px}
.out-steps{margin-bottom:0}
.honest{background:linear-gradient(135deg,rgba(185,160,220,.28),rgba(160,190,225,.22));border-radius:16px;padding:16px 18px;margin-top:22px;font-size:13px;line-height:1.8;color:var(--ink);border:1px solid rgba(140,110,180,.28)}.honest-t{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:6px}
.gcmd-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.gcmd-row{display:flex;align-items:center;gap:10px;background:#1E1530;border:1.5px solid #7A5AB0;border-radius:12px;padding:11px 14px;cursor:pointer;transition:background .15s,border-color .15s;text-align:left;color:#E8DEFF}
.gcmd-row:active,.gcmd-row.on{background:rgba(122,90,176,.25);border-color:#A07CE0}
.gcmd-row-txt{flex:1;font-size:13.5px;color:#3a2d50;line-height:1.5}
.gcmd-row-ico{flex-shrink:0;padding:6px 14px;border-radius:10px;background:rgba(160,124,224,.15);color:#C3A8E8;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.gcmd-row.on .gcmd-row-ico{background:#7A5AB0;color:#fff}
.gcmd-box{width:100%;box-sizing:border-box;border:1.5px solid #7A5AB0;border-radius:12px;padding:10px 14px;font-size:13px;color:#E8DEFF;background:#1E1530;resize:none;margin:10px 0 4px;line-height:1.6;cursor:pointer}.gcmd-box:focus{outline:none;border-color:#A07CE0}
.adj-light .tip-card{background:#fff;border:1.5px solid #7a5ab0;color:var(--ink);box-shadow:0 2px 8px rgba(100,80,140,.08)}
.adj-light .tip-card .tc-text{color:var(--ink)}
.adj-light .gcmd-row{background:#fff;border:1.5px solid #7a5ab0;color:var(--ink)}
.adj-light .gcmd-row:active,.adj-light .gcmd-row.on{background:rgba(122,90,176,.08);border-color:#5c3d9a}
.adj-light .gcmd-row-ico{background:rgba(122,90,176,.1);color:#7a5ab0}
.adj-light .gcmd-row.on .gcmd-row-ico{background:#7a5ab0;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(242,237,248,0) 0%,var(--bg) 22%);padding:28px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:600px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}.nav-div{max-width:600px;margin:0 auto 8px;height:1px;background:linear-gradient(to right,transparent,var(--line) 20%,var(--line) 80%,transparent)}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:11px 18px;cursor:pointer;border:none;background:transparent;color:var(--muted)}
.btn.go{background:linear-gradient(135deg,#8A6CC4,#B094E0);color:#FFFFFF;animation:shimmer 2s ease-in-out infinite;letter-spacing:.06em}.btn.go::before{content:"✦ ";font-size:15px}
@media (min-width:768px){.nav .in{justify-content:space-between}.btn.go{flex:0 0 auto}}
.btn:focus-visible,.sty:focus-visible,.ex:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.confirm-overlay{position:fixed;inset:0;background:rgba(30,20,50,.55);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.confirm-box{background:var(--surface);border-radius:20px;padding:28px 24px;max-width:300px;width:90%;text-align:center;box-shadow:0 16px 48px rgba(30,20,50,.25)}
.confirm-box h3{font-size:17px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.confirm-box p{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.6}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;font:inherit;font-size:14px;font-weight:700;border:none;border-radius:999px;padding:12px 8px;cursor:pointer}
.confirm-btns .c-yes{background:linear-gradient(135deg,#8A6CC4,#B094E0);color:#FFFFFF}
.confirm-btns .c-no{background:var(--line);color:var(--ink)}



/* === 四風格更新 CSS === */
/* p2 VLOG 日記 */
.p2.b1{background:#0a0a0a}
.p2.b2{background:#0a0a0a}
.p2.b3{background:#0a0a0a}
/* p4 獨白時刻 */
.p4.b1,.p4.b2,.p4.b3{background:#0a0a0a}
/* p1 b3 結尾頁藍天效果 */
.p1.b3{background:linear-gradient(165deg,#7BAFD4 0%,#A8CCE0 50%,#B8D8E8 100%)}
.p1.b3::before{background:rgba(0,0,0,.06)}
.p1.b3 .et{color:#1a2a3a}
.p1.b3 .es{color:#2a3a4a}
.p1.b3 .ek{color:#1a2a3a;border:1.5px solid rgba(26,42,58,.35);background:rgba(255,255,255,.6)}

/* ── style picker main ── */
.sp-zone{display:flex;flex-direction:column;gap:12px;margin:8px 0 4px}
.sp-sel-tag{font-size:13px;color:var(--muted);background:var(--surface);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sp-sel-tag b{color:var(--ink)}
.sp-open-btn{font:700 15px/1 inherit;color:#fff;background:var(--accent);border:none;border-radius:16px;padding:16px 20px;cursor:pointer;text-align:center;letter-spacing:.03em;transition:opacity .15s;width:100%}
.sp-open-btn:hover{opacity:.88}
/* ── 字體/大小/顏色面板 ── */
.fc-panel{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:8px}
.fc-tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px;margin-bottom:12px}
.fc-tab{flex:1;font:inherit;font-size:13px;font-weight:700;border:none;background:none;color:var(--muted);border-radius:999px;padding:7px 4px;cursor:pointer;transition:background .15s,color .15s}
.fc-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,30,60,.12)}
.fc-pane[hidden]{display:none}
.fc-row{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fc-row:last-child{margin-bottom:0}
.fc-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fc-chips{display:flex;flex-wrap:wrap;gap:5px}
.fc-chip{font:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;transition:border-color .12s,background .12s,color .12s}
.fc-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.fc-szs{display:flex;gap:5px}
.fc-sz{flex:1;font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 4px;cursor:pointer;text-align:center;transition:border-color .12s,background .12s,color .12s}
.fc-sz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.fc-clrs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fc-sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none;appearance:none;padding:0;outline-offset:2px;transition:box-shadow .12s}
.fc-sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.fc-free{position:relative;width:26px;height:26px;border-radius:50%;border:2px dashed var(--dash);cursor:pointer;padding:0;background:conic-gradient(red,orange,yellow,green,cyan,blue,violet,red);overflow:hidden;flex:none}
.fc-free input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);border:none;padding:0;cursor:pointer;opacity:0}
.fc-free-lbl{font-size:12px;color:var(--muted)}
.fc-active-clr{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);vertical-align:middle;margin-right:4px}
.sp-sep{text-align:center;font-size:12px;color:var(--muted);position:relative}
.sp-sep::before,.sp-sep::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--line)}
.sp-sep::before{left:0}.sp-sep::after{right:0}
.sp-alts{display:flex;flex-direction:column;gap:8px}
/* sp modal */
.sp-modal{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end}.sp-modal[hidden]{display:none}
.sp-s{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:0;pointer-events:none}
.sp-p{position:relative;z-index:1;width:100%;max-height:93dvh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sp-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.sp-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line);flex:none}
.sp-h b{font-size:17px}
.sp-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 50px;display:flex;flex-direction:column;gap:24px}
/* style card in picker */
.spc{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s}
.spc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
/* carousel inside picker: 正確 zoom，pv 保持 150px 基礎尺寸 */
.spc-car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:0;background:#fff;gap:8px}
.spc-car::-webkit-scrollbar{display:none}
.spc-car>.pv{flex:0 0 auto;scroll-snap-align:start;width:150px;zoom:2.1;border-radius:12px}
.pv-img{flex:0 0 auto;scroll-snap-align:start;width:130px;height:163px;object-fit:cover;border-radius:0;display:block}
.spc-info{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.spc-info b{font-size:15px;font-weight:700}
.spc-info span{font-size:12px;color:var(--muted)}
.spc-pick{font:700 14px/1 inherit;border:2px solid var(--accent);border-radius:999px;padding:11px 0;cursor:pointer;background:transparent;color:var(--accent);transition:background .15s,color .15s;text-align:center}
.spc.on .spc-pick{background:var(--accent);color:#fff}
.spc-extra{display:flex;flex-direction:column;gap:8px}
.lb-acc{font:inherit;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);cursor:pointer;padding:3px 10px;font-size:11px}
/* ── 風格卡片內嵌色票 ── */
.spc-clr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spc-clr-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
.spc-sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none;appearance:none;padding:0;transition:box-shadow .12s,transform .12s}
.spc-sw:hover{transform:scale(1.15)}
.spc-sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent),0 0 0 4px #fff}
.spc-free{position:relative;width:24px;height:24px;border-radius:50%;border:2px dashed var(--dash);overflow:hidden;flex:none;cursor:pointer;background:conic-gradient(red,orange,yellow,green,cyan,blue,violet,red)}
.spc-rand{font:inherit;font-size:16px;background:none;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--ink);line-height:1.4;transition:background .12s,transform .12s}
.spc-rand:hover{background:var(--bg);transform:rotate(20deg) scale(1.1)}
.spc-rand.spin{animation:sp-spin .4s ease}
@keyframes sp-spin{0%{transform:rotate(0)}50%{transform:rotate(-180deg) scale(1.15)}100%{transform:rotate(-360deg)}}
.spc-free input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);border:none;padding:0;cursor:pointer;opacity:0}
/* ── p3 渲染風情 完整定義（覆蓋所有舊版）── */
.p3{background:linear-gradient(168deg,#000510 0%,#040d2a 12%,#0a1a55 25%,#1e3a9a 40%,#5060d0 54%,#a0a8e8 66%,#d8dcf8 76%,#eceeff 86%,#f5f5ff 100%)}
.p3::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18)}
.p3.b1::before{background:rgba(0,0,0,.15)}
.p3.b2::before,.p3.b3::before{background:rgba(0,0,0,.10)}
.p3 .tt{left:8%;right:8%;top:18%;font:900 12px/1.3 var(--pvt);color:#fff;white-space:normal}
.p3 .sub{left:8%;right:8%;top:66%;font:300 6.5px/1.5 var(--pvb);color:rgba(255,255,255,.65)}
.p3 .acc{left:0;right:0;bottom:4%;text-align:center;font:400 6px var(--pvt);color:rgba(255,255,255,.6);letter-spacing:.1em;z-index:1}
.p3 .pg{right:6%;top:5%;font:500 5.5px var(--pvb);color:rgba(255,255,255,.4);letter-spacing:.1em}
.p3 .ilab{left:8%;top:12%;font:700 italic 8px Georgia,serif;color:#E8C47A;letter-spacing:.05em;text-transform:capitalize}
.p3 .ibar{left:8%;top:22%;width:18%;height:1px;background:rgba(255,255,255,.4)}
.p3 .itt{left:8%;right:8%;top:28%;font:700 10px/1.4 var(--pvt);color:#fff;white-space:normal}
.p3 .ib{left:8%;right:8%;top:50%;font:300 7px/1.8 var(--pvb);color:rgba(255,255,255,.8);white-space:normal}
.p3 .ep{left:8%;right:8%;top:10%;font:italic 400 5.5px/1.6 Georgia,serif;color:rgba(255,255,255,.7)}
.p3 .et{left:8%;right:8%;top:28%;font:900 11px/1.35 var(--pvt);color:#fff;white-space:normal}
.p3 .es{left:0;right:0;top:52%;text-align:center;font:300 6.5px var(--pvb);color:rgba(255,255,255,.65)}
.p3 .ek{left:8%;right:8%;top:67%;font:600 6px var(--pvb);color:rgba(255,255,255,.9);letter-spacing:.06em}
.p3 .full{display:none}
.p3 .panel{display:none}
/* ── p1 簡約生活 元素完整定義 ── */
.p1 .it{left:10%;top:14%;font:700 8.5px var(--pvt);color:var(--acc1);letter-spacing:.1em}
.p1 .ib{left:10%;right:10%;top:47%;font:300 7px/1.9 var(--pvb);color:rgba(255,255,255,.9);white-space:normal}
.p1 .pn{right:7%;bottom:6%;font:500 5.5px var(--pvt);letter-spacing:.12em;color:rgba(255,255,255,.55);text-align:right}
.p1 .et{left:0;right:0;top:30%;text-align:center;font:900 11px/1.4 var(--pvt);color:#1a2a3a;white-space:normal}
.p1 .es{left:0;right:0;top:52%;text-align:center;font:400 7px/1.5 var(--pvt);color:#2a3a4a;white-space:normal;letter-spacing:.04em}
.p1 .ek{left:50%;top:70%;transform:translateX(-50%);white-space:nowrap;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.72);color:#1a2a3a;font:700 6.5px var(--pvt);letter-spacing:.06em;border:1.5px solid rgba(26,42,58,.35)}

/* ── sp-modal redesign ── */
.sp-stabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.sp-stabs::-webkit-scrollbar{display:none}
.sp-stab{flex:none;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.sp-stab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sp-stpane.hidden{display:none}
.sp-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 10px;align-items:start}
@media(max-width:440px){.sp-2col{grid-template-columns:1fr}}
/* Live preview */
.sp-live{border-radius:12px;width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;padding:13px 11px 10px;gap:0;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.spl-cov{flex:1.3;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding-bottom:8px}
.spl-aline{width:28px;height:2px;border-radius:2px;margin-bottom:2px}
.spl-title{font-size:.95em;font-weight:700;line-height:1.3;word-break:break-all}
.spl-acct{font-size:.65em;letter-spacing:.05em;opacity:.8}
.spl-div{width:100%;height:1px;flex:none;opacity:.35}
.spl-inn{flex:1.6;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 0}
.spl-body{font-size:.75em;line-height:1.65}
.spl-end{flex:.8;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.spl-etxt{font-size:.68em;font-weight:700;letter-spacing:.06em;text-align:center}
.spl-zoomBtn{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,.45);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:none;line-height:1;padding:0}
/* live card preview (slc-*) */
.slc-wrap{padding:12px 16px 0}
.sp-live-wrap{border-radius:14px;overflow:hidden;position:relative;width:100%;aspect-ratio:4/5;box-shadow:0 3px 16px rgba(0,0,0,.28);background:var(--surface)}
.sp-prev-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:background-image .2s}
.sp-prev-ov{position:absolute;inset:0}
.slc-overlay-cov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,rgba(0,0,0,.08) 55%,transparent 100%)}
.slc-overlay-inn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:16px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.45) 40%,rgba(0,0,0,.45) 60%,rgba(0,0,0,.1) 100%)}
.slc-overlay-end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:16px 14px;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,rgba(0,0,0,.08) 55%,transparent 100%)}
.slc-txt{width:100%}
.slc-aline{width:24px;height:2px;border-radius:2px;margin-bottom:5px}
.sp-fc-inner{padding:0 16px;margin-top:10px}
.sp-zoom-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sp-prev-row{display:flex;gap:8px;padding:12px 16px 0}
.sp-prev-cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.sp-prev-cell img{width:100%;border-radius:10px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sp-prev-cell span{font-size:11px;color:var(--muted)}
/* Settings panel */
.sp-settings{display:flex;flex-direction:column;gap:0;min-width:0}
.sp-fc-tabs{margin-bottom:6px !important}
.sp-settings .fc-row{margin-bottom:7px}
.sp-settings .fc-row:last-child{margin-bottom:0}
.sp-settings .fc-chips{gap:4px}
.sp-settings .fc-chip{font-size:12px;padding:4px 9px}
.sp-settings .fc-szs{gap:4px}
.sp-settings .fc-sz{font-size:13px;padding:5px 2px}
/* Image strip */
.sp-imgs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px}
.sp-imgs::-webkit-scrollbar{display:none}
.sp-thumb{height:80px;border-radius:8px;object-fit:cover;cursor:pointer;flex:none;border:2px solid transparent;transition:border-color .12s,transform .12s;aspect-ratio:4/5}
.sp-thumb:hover{border-color:var(--accent);transform:scale(1.04)}
/* Lightbox */
.sp-lightbox{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center}
.sp-lb-bg{position:absolute;inset:0;background:rgba(0,0,0,.88)}
.sp-lb-wrap{position:relative;z-index:1;max-width:90vw;max-height:92vh;display:flex;align-items:center;justify-content:center}
.sp-lb-img{max-width:100%;max-height:88vh;border-radius:14px;display:block;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.sp-lb-close{position:absolute;top:-16px;right:-16px;width:34px;height:34px;border-radius:50%;background:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1}
.sp-pick-row{padding:0 16px 16px}

.sp-fc-box{margin:0 16px 24px;border-radius:14px}
.scan-modal{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;padding:16px}
.scan-modal[hidden]{display:none}
.scan-s{position:absolute;inset:0;background:rgba(22,18,28,.72)}
.scan-p{position:relative;width:min(92vw,460px);background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.scan-h{display:flex;justify-content:space-between;align-items:center}
.scan-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.scan-drop{border:2px dashed var(--dash);border-radius:16px;padding:24px 16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px;transition:border-color .15s;display:block}
.scan-drop:hover,.scan-drop.over{border-color:var(--accent);color:var(--accent)}
.scan-preview{width:100%;max-height:200px;object-fit:contain;border-radius:10px;display:none}
.scan-load{display:none;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);padding:16px 0}
.scan-load.on{display:flex}
.scan-spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-run{font:inherit;font-size:15px;font-weight:700;border:none;border-radius:999px;padding:12px 24px;background:var(--accent);color:#fff;cursor:pointer;width:100%;transition:opacity .15s}
.scan-run:disabled{opacity:.5;cursor:default}
.scan-entry{display:block;width:100%;max-width:320px;margin:8px auto 0;font:inherit;font-size:14px;font-weight:700;color:var(--accent);border:1.5px dashed var(--accent);background:none;border-radius:999px;padding:9px 20px;cursor:pointer}
</style>

<main id="app"></main>
<div class="scan-modal" id="scan" hidden>
 <div class="scan-s" id="scanBg"></div>
 <div class="scan-p">
  <div class="scan-h"><b>🖼️ 截圖分析</b><button class="scan-x" id="scanX">×</button></div>
  <p style="font-size:13px;color:var(--muted);margin:0">上傳一張你喜歡的 IG 貼文截圖，Claude 會分析它的排版風格並幫你生成輪播內容。</p>
  <img id="scanPreview" class="scan-preview" alt="預覽">
  <label class="scan-drop" id="scanDrop">點擊或拖曳截圖到這裡<input type="file" id="scanFile" accept="image/*" hidden></label>
  <div class="field"><label style="font-size:14px;font-weight:700;color:var(--muted)">你想說的主題（選填）</label><input type="text" id="scanTopic" placeholder="例如：放不下一段感情" style="font-size:16px"></div>
  <div class="scan-load" id="scanLoad"><div class="scan-spin"></div><span>Claude 正在分析截圖…</span></div>
  <p id="scanErr" style="font-size:13px;color:#e74c3c;margin:0"></p>
  <button type="button" class="scan-run" id="scanRun" disabled>✨ 分析並生成內容</button>
 </div>
</div>
<div class="nav" hidden><div class="nav-div"></div><div class="in">
  <button class="btn" id="back" type="button">上一步</button>
  <button class="btn go" id="next" type="button">下一步</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>

/* ── 獨立網站橋接層（買家自備 Anthropic API Key）──────────────────── */
(function(){

  /* ── API Key 管理 ─────────────────────────────────────────────── */
  function getApiKey(){
    let key = localStorage.getItem('_apiKey') || '';
    if(!key){
      key = (prompt(
        '請輸入你的 Anthropic API Key\n\n' +
        '📌 取得方式：https://console.anthropic.com/settings/keys\n' +
        '（輸入一次後即儲存，下次不需再輸入）'
      ) || '').trim();
      if(key) localStorage.setItem('_apiKey', key);
    }
    return key;
  }

  /* ── 直接呼叫 Anthropic API ───────────────────────────────────── */
  async function callAnthropic(prompt, opts={}){
    const key = getApiKey();
    if(!key) throw new Error('未輸入 API Key');

    // 建立訊息
    let content = [{ type:'text', text: prompt }];

    // 處理圖片（File/Blob → base64）
    if(opts.images && opts.images.length > 0){
      const imgBlocks = await Promise.all(opts.images.map(async img => {
        if(img instanceof File || img instanceof Blob){
          return await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => {
              const [, mime, data] = e.target.result.match(/^data:([^;]+);base64,(.+)$/);
              res({ type:'image', source:{ type:'base64', media_type:mime, data } });
            };
            r.onerror = rej;
            r.readAsDataURL(img);
          });
        }
        return { type:'image', source:{ type:'base64', media_type: img.type||'image/jpeg', data: img.data } };
      }));
      content = [...imgBlocks, ...content];
    }

    const body = {
      model: opts.model === 'complex' ? 'claude-opus-4-5' : 'claude-haiku-4-5-20251001',
      max_tokens: 4096,
      messages: [{ role:'user', content }],
    };
    if(opts.system) body.system = opts.system;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });

    if(res.status === 401){
      localStorage.removeItem('_apiKey');
      throw new Error('API Key 無效，請重新整理頁面重新輸入');
    }
    if(!res.ok){
      const e = await res.json().catch(()=>({error:{message:'未知錯誤'}}));
      throw new Error(e.error?.message || 'API 錯誤 ' + res.status);
    }

    const data = await res.json();
    return data.content?.find(c => c.type === 'text')?.text || '';
  }

  /* ── 模擬 sample capability ───────────────────────────────────── */
  window._sample = async function(prompt, opts={}){
    const text = await callAnthropic(prompt, opts);
    if(opts.onText) opts.onText({ text, delta: text });
    return { text };
  };
  window._sample.json = async function(prompt, opts={}){
    const text = await callAnthropic(prompt, opts);
    const m = text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('JSON 解析失敗，請再試一次');
    return JSON.parse(m[0]);
  };
  window._sample.limits = async function(){ return { images: true }; };

  /* ── 模擬 db capability（走 /api/feedback）────────────────────── */
  window._db = {
    collection: function(name){
      return {
        doc: function(id){
          return {
            set: async function(payload){
              const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              if(!res.ok){
                const e = await res.json().catch(()=>({error:'送出失敗'}));
                throw new Error(e.error||'送出失敗');
              }
            }
          };
        },
        orderBy: function(){ return this; },
        limit: function(){ return this; },
        get: async function(){
          const pwd = localStorage.getItem('_adminPwd') || '';
          const res = await fetch('/api/feedback', {
            headers: { 'x-admin-pwd': pwd },
          });
          if(!res.ok) throw new Error('無管理權限');
          const rows = await res.json();
          return {
            docs: (rows||[]).map(r=>({ data(){ return r; } }))
          };
        }
      };
    }
  };

  /* ── 管理員（5-tap）───────────────────────────────────────────── */
  window._isAdmin = function(){
    return !!localStorage.getItem('_adminPwd');
  };
  window._onAdminTap = function(){
    window._adminTap = (window._adminTap||0) + 1;
    clearTimeout(window._adminTimer);
    window._adminTimer = setTimeout(()=>{ window._adminTap=0; }, 1200);
    if(window._adminTap >= 5){
      window._adminTap = 0;
      const stored = localStorage.getItem('_adminPwd');
      if(stored){
        const tb = document.getElementById('fbAdminToggle');
        if(tb) tb.click();
      } else {
        const pwd = (prompt('請輸入管理密碼：')||'').trim();
        if(pwd){
          localStorage.setItem('_adminPwd', pwd);
          const tb = document.getElementById('fbAdminToggle');
          if(tb){ tb.style.display='flex'; tb.click(); }
        }
      }
    }
  };

})();
/* ── 橋接層結束 ─────────────────────────────────────────────────── */

  f:[['what','','',0]],exg:[['🃏 占卜師／塔羅','① 她把三張牌排開，盯著中間那張很久，說「這張我不喜歡」，我說「那正是我們要說的」。她說「我知道，但我不想看它」，我說「我知道，但它已經在那裡了」。那張牌是寶劍三。\n② 她說她只是想問工作的事，結果牌一翻，全是感情的牌。她說「牌是不是搞錯了」，我說「牌不會搞錯」，她沉默了很久，說「我其實知道它在說什麼，只是我不想承認那件事跟工作有關係」。\n③ 凱爾特十字一攤開，覆蓋牌是星幣國王，她一看到就說「是他嗎」，那個問法，讓我知道她心裡早有答案，她問的不是牌說什麼，是她想不想讓牌說那個。\n④ 她說她上週夢到寶劍三，特地來問那個夢是什麼意思。那張牌她沒有抽，是在夢裡主動來找她的，她說「我知道那個牌是什麼意思，但我不知道為什麼它進夢裡了」。\n⑤ 她把前任的名字寫在紙上，放在牌下面問。我問她「你想問什麼」，她說「我不知道，就想讓牌看看他」，我說「那你現在看到這些牌，有什麼感覺」，她說「我感覺他不在了」，然後沉默了很久。'],['🔮 占星師','① 她發來出生資料，說「你幫我看一下，我最近發生了一件大事，想知道是不是星盤說的」。我一看，冥王星正好行運到她的上升，我說「不只說，它說了很久了，你只是剛剛感覺到」。\n② 她說她和前任的合盤是她看過最美的，問我「那我們為什麼還是分開了？」我指給她看 Saturn 的位置，說「美，和能不能在一起，是兩件事，兩件都是真的」。\n③ 她把她媽媽的星盤也帶來了，說「我想知道我們為什麼一直有衝突」，那兩張圖並排放，很多東西一眼就清楚了，難的是要怎麼說、從哪裡說起。\n④ 她第一次看自己的星盤，指著一個位置說「這個是什麼，我從小就覺得自己這裡不對勁」，那個位置，和她說的，完全吻合。她說「所以我從小就這樣，不是後來出了什麼問題」，我說「對，這是你，不是問題」。\n⑤ 她的太陽在第十二宮，她說「所以我天生就是要隱形的嗎」，我說「不是隱形，是深水。深水不是不存在，是你看不到底」，她說「這個說法我第一次聽，但對，就是這個感覺」。'],['✨ 靈氣／療癒師','① 她進門前說「我不相信這些，但我媽叫我來試試」，我說沒關係，只要躺著就好。快結束的時候，她說「剛才那個感覺，是我自己想的還是你做的？」我說「都有，也都是你的」，她說「那我身體裡原來有這個？」\n② 她剛躺下就開始哭，我什麼都還沒做。她說「對不起，我也不知道為什麼，我進來就這樣了」，我說「你的身體在這裡很安全，它知道的比你快」，後來她說「我已經很久沒有讓自己在陌生的地方哭了」。\n③ 那次我手停在她的心輪，她的呼吸突然很不規則，然後長長地吐了一口，說「有什麼東西出去了」，我說「你感覺到了就好，不需要知道是什麼」，她說「好，我就讓它出去」。\n④ 她問我「你感覺得到什麼嗎」，我把手放在她的右側肩膀，她說「怎麼就是那裡，我也一直覺得那裡很緊，但我以為是我姿勢不好」，我說「不是姿勢，是有什麼還沒放下的東西在那裡」。\n⑤ 結束之後她不想起來，就躺著說「我上一次這樣放鬆是什麼時候，我不記得了」，然後說「這不是睡著的那種放鬆，是另一種，我沒有詞可以說，就是很在」，她說「我剛才很在」。'],['🌿 花精師','① 她來的時候帶了一張清單，列了她覺得自己有問題的地方，說「你看，我應該需要哪幾瓶」。我說「我們先聊聊，清單等等再說」，最後她選的三瓶，跟清單上一瓶都不一樣，她說「這樣對嗎」，我說「你身體選的，比清單準」。\n② 我把二十幾瓶排在桌上，說「你用感覺，哪幾瓶你會想要？」她說「這樣選可以嗎」，我說「這樣選才對」，她選了三瓶，每一瓶說到的，都是她還沒說出口的事，她選完自己也嚇了一跳。\n③ 她說她喝了第一週什麼感覺都沒有，問是不是選錯了。第三週，她傳訊說「我上週做了一個從來不會做的決定，不知道和花精有沒有關係」，我說「有關係，只是它不說話，它讓你慢慢變得能做那個決定」。\n④ 那瓶馬鞭草，她一拿起來說「這個名字好可愛」，沒多想就選了它。喝了三週後她說「我最近講話講慢了，以前我講話很快，是朋友說的，我自己沒發現」，那個慢，不是她刻意的。\n⑤ 她說她以前很抗拒情緒，覺得有情緒就是軟弱。後來她說「那瓶花精讓我第一次允許自己難過，不是因為我懂它，是因為喝了之後，有哪裡安全了，我才可以難過」，那個「安全了」，是她自己說的。'],['🌱 身心靈教練','① 她說她有一個人生問題，很大，問我「你能幫我解決嗎」，我說「解決不了，但我們可以把它看清楚一點」，她說「這樣也好，至少先看清楚」，那是她第一次願意把「搞清楚」當作一個目標。\n② 她說她不知道要不要換工作，說了很多理由，說完說「所以你覺得我應該換嗎」，我說「你說的那些裡面，哪一句是你真正在意的？」她想了很久，說了一句，那句跟她說的所有理由都不一樣。\n③ 她列出她的目標，我說「這些目標是你要的，還是你覺得你應該要的？」她說「什麼差別」，我說「前者讓你興奮，後者讓你焦慮」，她沉默了，說「那我列的這些，好像都讓我焦慮，我以為那是因為我還沒達到」。\n④ 她說「我有一個夢想，但我覺得我不值得有它」，我說「說說看那個夢想」，她說了，說完說「聽起來很蠢對不對」，我說「我沒有聽到任何蠢的地方，那個夢想很具體」，她說「你是客氣」，我說「我不客氣，具體的夢想才能實現」。\n⑤ 她說「我試著做了你說的那個練習，但我覺得我做錯了」，我說「說來聽聽」，她說了，我說「你沒做錯，你做的那個版本才是你的版本」，她說「原來可以不用跟你說的一樣？」我說「從來沒有說要一樣」。'],['🧘 冥想引導師','① 那次課有個新來的人，坐下說「我以前試過，靜不下來，這次是朋友硬拉來的」。帶完之後她說「你中間說的那句話，我就進去了」，那句話是「你不需要把它放下，只要讓它在那裡就好」，她說「我以前一直以為靜心就是清空」。\n② 我說「吸氣四拍，吐氣六拍」，有人說「我吐不了那麼長」，我說「那就吐你能吐的」，她說「這樣也可以？」我說「你的呼吸就是你的答案，不用跟別人一樣」，她後來說那句話讓她放鬆下來了。\n③ 那次課上到一半，有人的手機響了，她慌忙去關，說「對不起」，我說「沒關係，我們繼續」，奇怪的是，那個打斷之後，整個場反而更靜了。那個靜是真的靜下來了，不是表演的靜。\n④ 她說「我每次靜心都在想事情，停不下來」，我說「想就想吧，你只需要注意你在想」，她說「這個說法好奇怪，但我試試看」，後來她說「我發現我一直在想同一件事，原來那件事那麼重要，我一直沒有好好看它」。\n⑤ 帶到最後一個呼吸，有人輕聲說「我可以在嗎？」那是她第一次允許自己只是待在那裡，不需要去做什麼、有用什麼、往前什麼，就只是在。那句話我之後想了很久。'],['🪐 自身經歷','① 那天她進來坐下，什麼都沒說，只是把包包放在旁邊，然後就坐在那裡。我也沒說話，就這樣陪著。後來她才開口：「我不知道為什麼，就是想來這裡。」有些時候不需要理由，只是需要一個地方可以坐下來。\n② 她說她最近一直夢到同一個場景，醒來之後心跳很快，但說不清楚那個夢是什麼意思。我問她夢裡的感受是什麼。她想了很久說：「是一種被困住的感覺。」然後停了一下，說：「好像跟我現在的狀態一樣。」\n③ 她傳訊息說「我覺得我很廢」，然後補了一句「不好意思突然說這個」。我說沒關係，問她怎麼了。她說「就是覺得每件事都做不好，但說不出來是哪件事，就是整個人不對勁」。那種感覺很難解釋，但我完全懂。\n④ 那天是朋友的婚禮，她說她一整天都在笑，笑到臉很僵。回家之後一個人坐在床上，眼淚就掉下來了，自己也不知道為什麼。她說：「我明明很替她開心的。但我不知道那些眼淚是什麼。」\n⑤ 她說她在超市，走到一半突然不知道自己在買什麼，要去哪裡，為什麼站在那裡。就在走道裡愣了很久，然後直接回家了，東西沒買。那是她第一次意識到，自己快撐不住了。']]},

  f:[['turn','','',0]],exg:[['🃏 占卜師／塔羅','① 她一翻到月亮牌，直接說「我不喜歡這張」，我說「喜不喜歡不重要，它在這裡了」，她說「我知道它在說什麼，我只是不想讓你說出來」，那是整場我覺得最重要的一句話。\n② 我攤開愛爾蘭陣，覆蓋牌是死神牌，她沉默了大概十秒，說「是這個嗎」，我說「你覺得它在說什麼？」，她說了，說完說「我剛才說的，是我自己說的，不是你告訴我的」，對，就是這樣。\n③ 她翻了聖杯二，然後看著它說「我希望是這樣，但我不信它」，我說「你希望，這件事本身，就已經是一個答案了」，她停下來看著我，說「你這樣說我沒有辦法繼續不信了」。\n④ 她問「這張牌是好是壞」，我說「它沒有好壞，只有現在這個位置它說的是什麼」，她說「那它說什麼？」我說了，她說「對，我知道，我只是需要聽到別人也這樣說」，那個「我知道」，才是她真正來這裡的原因。\n⑤ 最後一張抽到星幣四，她說「這個感覺在說我很執著」，我說「不是執著，是安全感，你需要確定它還在，才能呼吸」，她說「這個比執著好聽，但是一樣的東西」，然後笑了，那個笑帶著一點自我解嘲，也帶著放鬆。'],['🔮 占星師','① 我指著她的上升，說「你天生就是這樣對外表現的，不是裝的，是設定」，她說「所以那不是我的問題？」，我說「從來不是問題，是你的起手式」，她吐了一口氣，說「我花了很久以為那是缺點」。\n② 她說「我和前任的合盤很好，但我們分了，怎麼解釋？」我說「合盤好，說的是吸引和共鳴，不是能不能走下去，那是兩件事」，她沉默了，說「所以是真的很好，但就是走不下去，這兩個都是真的？」對，都是真的。\n③ 她指著金星和土星的相位，說「這個看起來很難」，我說「是有功課，但土星也是承諾，你的感情裡不是沒有，是要你認真才有」，她說「我以前以為認真就夠了，後來才知道方向也要對」，我說「那你現在知道了，這就是這個相位現在告訴你的」。\n④ 她第一次看命盤，我說到第十二宮，她說「所以我一直覺得自己藏著一個別人不知道的部分，是因為這個？」我說「這個宮位的人都有一個深處，不是秘密，是核心，只有安全的人才能進去」，她說「那我一直找的，就是那個能進去的人」，對，就是那個。\n⑤ 我說「行運冥王星今年會到你的第七宮」，她說「第七宮是感情嗎？」我說「是，也是你跟他人的關係方式，它要來重組的，是你對關係的定義」，她說「所以今年那些事不是意外」，我說「不是意外，是你一直在來的路上」。'],['✨ 靈氣／療癒師','① 我手還沒靠近，她說「我感覺到熱」，我說「是你自己的能量在動，不是我給的」，她說「那這個是我的？」我說「一直是，只是現在你感覺到了」，她安靜下來，那個安靜很不一樣，是知道了之後的那種靜。\n② 手停在她頭頂，我沒有動，就讓能量流，她突然說「有人在旁邊嗎？」我說「就我們兩個」，她說「但我感覺有人站在我右邊，很溫的感覺」，我沒有說什麼，就繼續。有些事不需要解釋，只需要發生。\n③ 她說「你的手在我的喉嚨附近那段，我有很多話想說但說不出來」，我說「不用說，讓它在那裡就好」，她說「但有一個聲音一直卡著」，我說「那個聲音需要被感覺到，不是被說出來」，她長吐一口氣，那個氣是從很深的地方出來的。\n④ 結束後她說「我的右肩比左肩輕」，我問「那個輕是什麼感覺？」，她說「就是輕，像把一個包包放下了，但我不知道我有在背包包」，我說「你背很久了」，她說「我知道，但我以為那是我」。\n⑤ 她說「做的時候我一直想控制，想知道你在做什麼，想搞懂那個感覺是什麼，然後有一秒我放棄搞懂了，那一秒就全部鬆了」，我說「那一秒，才是療癒開始的地方」，她說「所以我一直在擋自己」，對，是的。'],['🌿 花精師','① 她站在桌前，我說「你直覺想拿哪幾瓶？不用想，手先動」，她拿了橡樹，然後說「我不知道為什麼拿這個」，我說「橡樹是給一直撐著、不讓自己停下來的人」，她說「啊」，就一個字，然後把那瓶握得很緊。\n② 她聞了馬鞭草，說「好像媽媽煮東西的味道」，然後自己也嚇了一跳說「我怎麼想到這個」，我說「花精有時候會繞回去，繞到你需要的地方」，她說「那個地方我很久沒有去了」，那句話不是在說味道。\n③ 她傳訊說「喝了三週，我媽打電話來，我沒有跟她吵」，然後說「我也不知道是我忍的還是真的沒有那麼生氣了，感覺不一樣了」，那個「感覺不一樣了」，不是忍，是有什麼在她裡面移動了。\n④ 選完三瓶，她說「這樣可以嗎，我感覺我選得很隨便」，我說「你剛才選的三瓶，我說說它們在說什麼，你看準不準」，我說了，她一瓶一瓶點頭，說「這不是隨便，這是你早就知道，只是沒有人問你」。\n⑤ 她說「喝完那瓶鳳仙花之後，我有一次情緒很激動，但我沒有爆出來，我停下來問自己『我現在感覺到什麼』，然後我就說出來了，我以前不會問自己這個」，那不是花精讓她這樣，是花精讓她有空間這樣。'],['🌱 身心靈教練','① 我問「那件事最讓你難受的是什麼？」，她說了一個原因，我說「那個原因的背後呢？」，她說了另一個，我再問「那個的背後？」，她想了很久，說「是我怕我不夠好」，說完愣了一下，說「我怎麼說到這裡了，我以為我是來談工作的」。\n② 她說「我覺得我沒有資格有夢想，因為我連現在的事都做不好」，我說「等等，現在的事你哪裡沒做好？」，她說了幾件，我說「這幾件聽起來你做到了，就是做得很辛苦」，她說「對，但辛苦不等於做好了嗎？」，我說「等於」，她沉默了，說「那我沒有我以為的那麼差」。\n③ 她說「我設定了一個目標，但我一直沒有開始，因為我怕失敗」，我說「你現在在做什麼，讓你不用開始？」，她說「什麼都做」，我說「那就是了，忙是很好用的藉口，不需要面對還沒開始的那件事」，她說「我被你說中了，但我不想承認」。\n④ 她說「你上次問我那個問題，我回去想了一個禮拜」，我說「哪個問題？」，她說「你問我，如果不需要讓別人開心，你會選什麼？那個問題我回答不了，我坐在那裡才發現我從來沒想過這件事」，那個發現，比任何答案都重要。\n⑤ 她說「我知道我應該說不，但我說不出口」，我問「說不的時候你怕什麼？」，她說「怕對方失望」，我說「如果你說了不，他真的就消失了，那這段關係是什麼形狀的？」，她看著我說「那是個交換，不是關係」，那句話是她說的，不是我。'],['🧘 冥想引導師','① 帶到第三個呼吸，整個房間突然安靜下來了，不是大家在忍，是真的靜了，那個靜和剛才的靜不一樣，我感覺到它換了，我就不再說話，讓那個靜待在那裡。\n② 引導「把注意力放在吐氣的尾端」，有人說「那個尾端是什麼？」，我說「就是氣要沒了、但還沒完全沒的那一刻」，她說「我找到了」，然後沉默了，然後說「我以為我知道怎麼呼吸」，有些事你以為你會，靜下來才發現你不會。\n③ 引導大家把手放在心口，有人的肩膀垮下來了，不是放鬆的垮，是撐了很久終於不用再撐的那種，我看見了，沒有說話，就繼續帶，有些時候你看見了，不說，是保護。\n④ 靜心收尾，我說「接下來這一分鐘，什麼都不用做，只要在」，有人輕輕哭了，我沒有暫停，繼續帶，什麼都不用做這句話，對有些人來說是最難的功課。\n⑤ 她說「我做到一半有個念頭冒出來，我很想把它趕走，後來我就讓它在那裡，它在了一下，然後自己走了」，她說「原來我不用趕它，它自己走」，我說「對，你不趕，它才走得了」，她說「那我平常一直在做相反的事」。'],['🪐 自身經歷','① 她說「我覺得我一直在讓別人安心，但沒有人讓我安心過」，說完愣了一下，說「我剛才說了什麼？」那是她第一次說出這句話。她自己都不知道，這句話在心裡放了多久。\n② 她說完「我想休息」，自己也停了下來。她說「我以前從來不敢說這句話，覺得說出來就是偷懶」。我問她現在說出來有什麼感覺，她想了很久說：「有點陌生，但很輕。」\n③ 那通電話她說了很多，說到最後她說「我說完了」，然後沉默了很久。後來她說「謝謝你讓我說完，我從來沒有一次說這麼完整過」。有些人只是需要一個空間，可以說完。\n④ 她說她花了很多年在等一個人懂她，等到後來才發現，她自己也說不清楚她需要什麼。她說「我好像從來沒有真的認識過自己」，那句話說出來，她哭了。\n⑤ 我問她「你自己想要什麼？」，她沉默了很久，說「我不知道，我一直以為我知道的」。那個不知道，不是空白，是她第一次停下來認真問自己這個問題。']]},

// 解析 Claude 給的結構化文字稿
function parsePasted(text){
 const d={cover:{},inner:[],end:{},caption:''};
 const lines=text.replace(/\r\n/g,'\n').split('\n');
 let sec=null,collecting=null,buf=[];
 function flush(){if(collecting&&buf.length){const val=buf.join('\n').trim();if(!val){buf=[];collecting=null;return;}if(collecting.sec==='inner_cur'){if(d.inner.length)d.inner[d.inner.length-1][collecting.key]=val;}else if(collecting.sec==='_cap'){if(!d._cap)d._cap={};d._cap[collecting.key]=val;}else{d[collecting.sec][collecting.key]=val;}buf=[];collecting=null;}}
 for(let raw of lines){
  // 去掉 markdown 粗體標記、子彈前綴，再 trim
  const l=raw.replace(/^\*{1,2}|^\*{1,2}$/g,'').replace(/^[-•*]\s+/,'').trim();
  if(!l){if(collecting)buf.push('');continue;}
  // 標題段落識別：允許【封面】【封面頁】**【封面】** 等變體
  const lClean=l.replace(/^\*+|\*+$/g,'').replace(/^#+ /,'').trim();
  const hd=lClean.match(/^【\s*(封面|結尾|Caption|0*(\d+))\s*】/);
  if(hd){flush();
   const k=hd[1].trim();
   if(k==='封面')sec='cover';
   else if(k==='結尾')sec='end';
   else if(k==='Caption'){sec='caption';collecting=null;buf=[];}
   else{sec='inner';d.inner.push({});collecting=null;}
   continue;}
  if(sec==='caption'){buf.push(raw);continue;}
  // key-value 行：允許 **標題**：value 或 標題：value
  const kv=lClean.replace(/\*+/g,'').match(/^(標題|副標|正文|金句|互動|副題|小標)：(.*)$/);
  if(kv){flush();
   const keymap={標題:'title',副標:'sub',副題:'sub',小標:'sub',正文:'body',金句:'title',互動:'cta'};
   const key=keymap[kv[1]]||'body';
   const rest=kv[2].trim();
   if(sec==='cover'){if(rest){d.cover[key]=rest;}else{collecting={sec:'cover',key};buf=[];}}
   else if(sec==='end'){if(rest){d.end[key]=rest;}else{collecting={sec:'end',key};buf=[];}}
   else if(sec==='inner'&&d.inner.length){const cur=d.inner[d.inner.length-1];if(rest){cur[key]=rest;}else{collecting={sec:'inner_cur',key};buf=[];}}
   continue;}
  if(collecting&&collecting.sec==='inner_cur'&&d.inner.length){buf.push(raw);}
  else if(collecting){buf.push(raw);}
 }
 flush();
 if(sec==='caption')d.caption=buf.join('\n').trim();
 return d;
}

  if(!sample){throw new Error('sample 功能目前不可用，請確認是否已登入 Claude');}
  const lim=await sample.limits().catch(()=>null);
  if(!lim?.images){throw new Error('此裝置不支援圖片分析功能（images_unavailable）');}
  const prompt=`你是一位 IG 輪播貼文的設計師，請分析這張 IG 截圖的排版風格，並根據${topic?'主題「'+topic+'」':'截圖的視覺內容'}生成一份繁體中文的輪播貼文內容。\n\n請只回覆以下 JSON，不要加任何說明：\n{"cover":{"title":"封面標題（15字內）","sub":"副標（20字內）"},"inner":[{"title":"第2張標題","body":"內文（3-4行，每行20字內）"},{"title":"第3張標題","body":"內文（3-4行，每行20字內）"},{"title":"第4張標題","body":"內文（3-4行，每行20字內）"},{"title":"第5張標題","body":"內文（3-4行，每行20字內）"}],"end":{"title":"結尾頁標題","cta":"行動呼籲文字"}}`;
  const res=await sample.json(prompt,{images:[_inScanFile],modelTier:'default',cache:false});
  if(!res||!res.cover)throw new Error('分析結果格式不符，請再試一次');
  A._scanData=res;A._scanTopic=topic;if(!A.style||!['film','night','east','diary'].includes(A.style))A.style='film';
  save();render();window.scrollTo(0,0);toast('✅ 分析完成！點「繼續出圖」生成輪播');
 }catch(err){
  const code=err.code||'';
  const msg=code==='not_granted'?'請先允許此工具使用 Claude':code==='images_unavailable'?'此裝置不支援圖片分析':code==='image_rejected'?'圖片格式有問題，請換一張試試':code==='rate_limited'?'使用頻率太高，請稍後再試':(err.message||'未知錯誤');
  if(errEl)errEl.textContent='分析失敗：'+msg;
  if(runBtn)runBtn.disabled=false;
 }
 if(loadEl)loadEl.classList.remove('on');
}

let _scanModalFile=null;
function openScanModal(){}
function closeScanModal(){document.getElementById('scan').setAttribute('hidden','');}
document.getElementById('scan').addEventListener('click',e=>{
 if(e.target.closest('#scanX')||e.target.closest('#scanBg'))closeScanModal();
});

let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600)}
render();
</script>
